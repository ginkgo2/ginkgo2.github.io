<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<body data-page="index">

<header class="site-head">
  <div class="wrap head-inner">
    <a class="brand" href="./index.html">感官友好评估</a>
    <nav class="nav" id="nav" aria-label="主导航"></nav>
  </div>
</header>

<main id="main" class="wrap">

  <section class="hero">
    <h1>一个地方进去以后，会怎么样</h1>
    <p class="lead">六项观察，四档定级。写清楚哪个时段去、从哪个门进、要不要带耳罩。</p>
  </section>

  <ul class="stats" id="stats" hidden></ul>

  <div class="entry">
    <a href="./list.html">
      <span class="entry-title">清单</span>
      <span class="entry-sub">测过的点位，按类型和等级筛</span>
    </a>
    <a href="./map.html">
      <span class="entry-title">地图</span>
      <span class="entry-sub">哪些评过，哪片还空着</span>

  </div>

  <h2>六项</h2>
  <ul class="dims">
    <li><a href="./method.html#dim-noise">噪声</a></li>

    <li><a href="./method.html#dim-light">光环境与视觉杂乱</a></li>

<footer class="site-foot">
  <div class="wrap" id="foot"></div>
</footer>

<script src="./data/points.js"></script>
<script src="./assets/js/core.js"></script>
<script>
(function () {
  var list = window.SF.points();
  if (!list.length) return;

  var verified = list.filter(function (p) { return p.status === 'verified'; });
  var rec = verified.filter(function (p) { return p.level === 'recommended'; }).length;
  var cond = verified.filter(function (p) { return p.level === 'conditional'; }).length;

  var stats = document.getElementById('stats');
  stats.innerHTML =
    '<li><span class="num">' + verified.length + '</span><span class="lab">已核验点位</span></li>' +
    '<li><span class="num">' + rec + '</span><span class="lab">推荐</span></li>' +
    '<li><span class="num">' + cond + '</span><span class="lab">有条件推荐</span></li>';
  stats.hidden = false;
})();
</script>

</body>
</html>
