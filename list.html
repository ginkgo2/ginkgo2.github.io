<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>清单 · 感官友好评估</title>
<link rel="stylesheet" href="./assets/css/site.css?v=202611141336">
</head>
<body data-page="list">

<a class="skip" href="#main">跳到正文</a>

<header class="site-head">
  <div class="wrap head-inner">
    <a class="brand" href="./index.html">感官友好评估</a>
    <nav class="nav" id="nav" aria-label="主导航"></nav>
  </div>
</header>

<main id="main" class="wrap">

  <header class="page-head">
    <h1>清单</h1>
    <p class="lead">按环境类型和等级筛。每条写明依据和一句建议。</p>
  </header>

  <div class="filters" id="filters" hidden></div>
  <div id="results"></div>

</main>

<footer class="site-foot">
  <div class="wrap" id="foot"></div>
</footer>

<script src="./data/points.js?v=202611141336"></script>
<script src="./data/build.js?v=202611141336"></script>
<script src="./assets/js/core.js?v=202611141336"></script>
<script>
(function () {
  var SF = window.SF;
  var data = SF.points();
  var filters = document.getElementById('filters');
  var host = document.getElementById('results');
  var state = { envType: '', level: '' };

  var GROUPS = [
    {
      key: 'envType',
      label: '环境类型',
      options: [{ v: '', t: '全部' }].concat(SF.ENV_TYPES.map(function (t) {
        return { v: t.id, t: t.name };
      }))
    },
    {
      key: 'level',
      label: '等级',
      options: [
        { v: '', t: '全部' },
        { v: 'recommended', t: '推荐' },
        { v: 'conditional', t: '有条件推荐' }
      ]
    }
  ];

  function card(p) {
    var lv = SF.LEVELS[p.level] || SF.LEVELS.no_data;
    var type = (SF.ENV_TYPES.filter(function (t) { return t.id === p.envType; })[0] || {}).name || '';
    return '<article class="card">' +
      '<div class="dim-head"><h2 style="margin:0;font-size:1.0625rem">' + SF.esc(p.name) + '</h2>' +
      '<span class="hint">' + SF.esc(type) + ' · ' + SF.fmtDate(p.observedAt) + '</span></div>' +
      '<p style="margin:10px 0 6px"><span class="badge badge-' + lv.cls + '">' +
      '<span class="glyph" aria-hidden="true">' + lv.glyph + '</span>' + lv.label + '</span></p>' +
      '<p class="prose" style="margin:0">' + SF.esc(p.note || lv.text) + '</p>' +
      '</article>';
  }

  function render() {
    var list = data.filter(function (p) {
      return (!state.envType || p.envType === state.envType) &&
             (!state.level || p.level === state.level);
    });
    if (!list.length) {
      host.innerHTML = '<div class="empty">没有符合条件的点位。</div>';
      return;
    }
    host.innerHTML = list.map(card).join('');
  }

  function updateChips() {
    SF.$$('.chip', filters).forEach(function (btn) {
      var key = btn.getAttribute('data-filter');
      var val = btn.getAttribute('data-value');
      var n = data.filter(function (p) {
        var self = !val || p[key] === val;
        var other = key === 'envType'
          ? (!state.level || p.level === state.level)
          : (!state.envType || p.envType === state.envType);
        return self && other;
      }).length;
      btn.querySelector('.count').textContent = n;
      btn.setAttribute('aria-pressed', state[key] === val ? 'true' : 'false');
    });
  }

  if (!data.length) {
    host.innerHTML = '<div class="empty">还没有点位。</div>';
    return;
  }

  filters.hidden = false;
  filters.innerHTML = GROUPS.map(function (g) {
    return '<div class="filter-row">' +
      '<span class="filter-label">' + g.label + '</span>' +
      '<div class="group" role="group" aria-label="' + g.label + '">' +
      g.options.map(function (o) {
        return '<button type="button" class="chip" data-filter="' + g.key +
          '" data-value="' + o.v + '" aria-pressed="false">' + o.t +
          '<span class="count">0</span></button>';
      }).join('') +
      '</div></div>';
  }).join('');

  filters.addEventListener('click', function (e) {
    var btn = e.target.closest('.chip');
    if (!btn) return;
    state[btn.getAttribute('data-filter')] = btn.getAttribute('data-value');
    updateChips();
    render();
  });

  updateChips();
  render();
})();
</script>

</body>
</html>
