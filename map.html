<main id="main" class="wrap">

  <header class="page-head">

  </header>

  <div class="map-search">
    <input type="search" id="q" placeholder="搜索地名、路名、医院、学校" autocomplete="off" aria-label="搜索地图上的名字">
    <ul id="q-list" class="q-list" hidden></ul>
  </div>

  <div class="map-wrap">
    <div id="map" class="map-shell ml-shell" role="application" aria-label="海港区点位地图，可拖动和缩放"></div>

    <p class="hint">标点模式：在地图上点一下，坐标就出来了，填进 places.csv 的 x/y 列。</p>
    <p><strong id="pick-coord">—</strong></p>
    <button type="button" class="btn btn-ghost" id="pick-copy">复制坐标</button>
  </div>

  <aside id="card" class="card" hidden aria-live="polite"></aside>

</main>

<footer class="site-foot">

      <span class="foot-build" id="build"></span>

<script src="./data/points.js?v=202611171659"></script>
<script src="./data/landmarks.js?v=202611171659"></script>
<script src="./data/labels.js?v=202611171659"></script>
<script src="./data/labels-detail.js?v=202611171659"></script>
<script src="./data/build.js?v=202611171659"></script>
<script src="./assets/js/core.js?v=202611171659"></script>

<script type="module">
import * as maplibregl from './assets/vendor/maplibre/maplibre-gl.mjs';

const SF = window.SF;
const BBOX = { s: 39.878, w: 119.515, n: 39.958, e: 119.683 };
const W = 1000, H = 620;

const lat0 = (BBOX.s + BBOX.n) / 2;
const kx = Math.cos(lat0 * Math.PI / 180);
const dx = (BBOX.e - BBOX.w) * kx;
const dy = BBOX.n - BBOX.s;
const scale = Math.min(W / dx, H / dy);
const offX = (W - dx * scale) / 2;
const offY = (H - dy * scale) / 2;

const toLngLat = (x, y) => [BBOX.w + (x - offX) / (kx * scale), BBOX.n - (y - offY) / scale];
const toXY = (lng, lat) => [(lng - BBOX.w) * kx * scale + offX, (BBOX.n - lat) * scale + offY];

const points = SF.points();
const hasRecommended = points.some(p => p.level === 'recommended');

const cardHost = document.getElementById('card');
const shown = document.getElementById('shown');
const empty = document.getElementById('empty');

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {},
    layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#f7f5f1' } }]
  },
  bounds: [[BBOX.w, BBOX.s], [BBOX.e, BBOX.n]],
  fitBoundsOptions: { padding: 10 },
  attributionControl: false,
  dragRotate: false,
  pitchWithRotate: false,
  preserveDrawingBuffer: true
});

map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

let z0 = 13;

map.on('load', async () => {
  z0 = map.getZoom();

  const [base, detail] = await Promise.all([
    fetch('./data/map-base.geojson').then(r => r.json()),
    fetch('./data/map-detail.geojson').then(r => r.json())
  ]);

  map.addSource('base', { type: 'geojson', data: base });
  map.addSource('detail', { type: 'geojson', data: detail });

  map.addLayer({ id: 'water', type: 'fill', source: 'base', filter: ['==', ['get', 'kind'], 'water'], paint: { 'fill-color': '#d5e7f0' } });
  map.addLayer({ id: 'park', type: 'fill', source: 'base', filter: ['==', ['get', 'kind'], 'park'], paint: { 'fill-color': '#dfeada' } });

  const widths = { motorway: 3.8, trunk: 3.3, primary: 2.6, secondary: 1.9, tertiary: 1.3 };
  const colors = { motorway: '#efc469', trunk: '#f3d39a', primary: '#fbe7c2', secondary: '#ffffff', tertiary: '#ffffff' };
  const casings = { motorway: '#dcb877', trunk: '#ddc49a', primary: '#ddd0b6', secondary: '#ded8cc', tertiary: '#e6e1d7' };

  for (const cls of ['tertiary', 'secondary', 'primary', 'trunk', 'motorway']) {
    map.addLayer({
      id: 'road-c-' + cls, type: 'line', source: 'base',
      filter: ['all', ['==', ['get', 'kind'], 'road'], ['==', ['get', 'cls'], cls]],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: {
        'line-color': casings[cls],
        'line-width': ['interpolate', ['linear'], ['zoom'], z0 - 1, widths[cls] + 1.1, z0 + 4, (widths[cls] + 1.1) * 1.9]
      }
    });
    map.addLayer({
      id: 'road-f-' + cls, type: 'line', source: 'base',
      filter: ['all', ['==', ['get', 'kind'], 'road'], ['==', ['get', 'cls'], cls]],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: {
        'line-color': colors[cls],
        'line-width': ['interpolate', ['linear'], ['zoom'], z0 - 1, widths[cls], z0 + 4, widths[cls] * 1.9]
      }
    });
  }

  map.addLayer({
    id: 'minor-casing', type: 'line', source: 'detail', minzoom: z0 + 1.2,
    filter: ['==', ['get', 'kind'], 'minor'],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#d8d2c4', 'line-width': ['interpolate', ['linear'], ['zoom'], z0 + 1.2, 1.6, z0 + 5, 3.4] }
  });
  map.addLayer({
    id: 'minor', type: 'line', source: 'detail', minzoom: z0 + 1.2,
    filter: ['==', ['get', 'kind'], 'minor'],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ffffff', 'line-width': ['interpolate', ['linear'], ['zoom'], z0 + 1.2, 1.0, z0 + 5, 2.4] }
  });

  // 建筑按面积分三档：大的先出现，小的后出现
  const bPaint = { 'fill-color': '#e2ddcf', 'fill-outline-color': '#d2cbbb' };
  map.addLayer({
    id: 'bld-big', type: 'fill', source: 'detail', minzoom: z0 + 0.9,
    filter: ['all', ['==', ['get', 'kind'], 'building'], ['>=', ['get', 'a'], 1500]],
    paint: bPaint
  });
  map.addLayer({
    id: 'bld-mid', type: 'fill', source: 'detail', minzoom: z0 + 1.6,
    filter: ['all', ['==', ['get', 'kind'], 'building'], ['>=', ['get', 'a'], 400], ['<', ['get', 'a'], 1500]],
    paint: bPaint
  });
  map.addLayer({
    id: 'bld-small', type: 'fill', source: 'detail', minzoom: z0 + 2.2,
    filter: ['all', ['==', ['get', 'kind'], 'building'], ['<', ['get', 'a'], 400]],
    paint: bPaint
  });

  map.addLayer({
    id: 'gate', type: 'circle', source: 'detail', minzoom: z0 + 2.0,
    filter: ['==', ['get', 'kind'], 'gate'],
    paint: { 'circle-color': '#a03b2f', 'circle-radius': ['interpolate', ['linear'], ['zoom'], z0 + 2, 3, z0 + 5, 6], 'circle-stroke-color': '#fff', 'circle-stroke-width': 1 }
  });

  startOverlay();
  updateLegend();
  initSearch();
});

/* ---------- 叠层：标签 + 点位 ---------- */

let overlay = null;
let labelNodes = [];
let pointNodes = [];

function zoomToScale(z) { return Math.pow(2, z - z0); }

function tiersAt(s) {
  if (s < 1.6) return [1];
  if (s < 2.4) return [2];
  return [2, 3];
}

function startOverlay() {
  const host = document.getElementById('map');
  const layer = document.createElement('div');
  layer.className = 'ml-overlay';
  host.appendChild(layer);
  overlay = layer;

  const all = (window.SF_LABELS || []).concat(window.SF_LABELS_DETAIL || []);
  labelNodes = all.map(l => {
    const el = document.createElement('span');
    el.className = 'ml-lbl t' + l.t;
    el.textContent = l.n;
    el.style.display = 'none';
    layer.appendChild(el);
    return { el, ll: toLngLat(l.x, l.y), t: l.t };
  });

  pointNodes = points
    .filter(p => isFinite(Number(p.x)) && isFinite(Number(p.y)))
    .map(p => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'ml-pin ' + (p.level === 'recommended' ? 'ok' : 'warn');
      el.title = p.name;
      el.addEventListener('click', () => showCard(p));
      layer.appendChild(el);
      return { el, ll: toLngLat(Number(p.x), Number(p.y)), p };
    });

  map.on('move', scheduleOverlay);
  map.on('zoom', scheduleOverlay);
  map.on('resize', scheduleOverlay);
  scheduleOverlay();

  if (!points.length) empty.hidden = false;
}

let raf = 0;
function scheduleOverlay() {
  if (!raf) raf = requestAnimationFrame(renderOverlay);
}

function renderOverlay() {
  raf = 0;
  const size = map.getCanvas().getBoundingClientRect();
  const s = zoomToScale(map.getZoom());
  const want = tiersAt(s);
  const placed = [];

  for (const n of labelNodes) {
    if (want.indexOf(n.t) < 0) { n.el.style.display = 'none'; continue; }

    const p = map.project(n.ll);
    if (p.x < -100 || p.x > size.width + 100 || p.y < -30 || p.y > size.height + 30) {
      n.el.style.display = 'none';
      continue;
    }

    const w = n.el.textContent.length * (n.t === 1 ? 14 : 12) * 0.95;
    const h = n.t === 1 ? 17 : 14;
    const box = { x1: p.x - w / 2, x2: p.x + w / 2, y1: p.y - h / 2, y2: p.y + h / 2 };

    let hit = false;
    for (const b of placed) {
      if (box.x1 < b.x2 && box.x2 > b.x1 && box.y1 < b.y2 && box.y2 > b.y1) { hit = true; break; }
    }
    if (hit) { n.el.style.display = 'none'; continue; }

    placed.push(box);
    n.el.style.display = '';
    n.el.style.left = p.x + 'px';
    n.el.style.top = p.y + 'px';
  }

  for (const n of pointNodes) {
    const p = map.project(n.ll);
    const visible = s >= 1.6 || n.p.level === 'recommended' || !hasRecommended;
    if (!visible) { n.el.style.display = 'none'; continue; }
    n.el.style.display = '';
    n.el.style.left = p.x + 'px';
    n.el.style.top = p.y + 'px';
  }
}

function updateLegend() {
  if (!points.length) { shown.textContent = ''; return; }
  shown.textContent = '共 ' + points.length + ' 个点位';
}

function showCard(p) {
  const lv = SF.LEVELS[p.level] || SF.LEVELS.no_data;
  const type = (SF.ENV_TYPES.filter(t => t.id === p.envType)[0] || {}).name || '';
  cardHost.innerHTML =
    '<h2 style="margin:0 0 4px;font-size:1.0625rem">' + SF.esc(p.name) + '</h2>' +
    '<p class="hint" style="margin:0">' + SF.esc(type) + ' · ' + SF.fmtDate(p.observedAt) + '</p>' +
    '<p style="margin:10px 0 0"><span class="badge badge-' + lv.cls + '">' +
    '<span class="glyph" aria-hidden="true">' + lv.glyph + '</span>' + lv.label + '</span></p>' +
    SF.scoreBars(p.scores) +
    '<p class="prose" style="margin:14px 0 0">' + SF.esc(p.note || lv.text) + '</p>';
  cardHost.hidden = false;
}

/* ---------- 搜索 ---------- */

function initSearch() {
  const input = document.getElementById('q');
  const list = document.getElementById('q-list');
  if (!input || !list) return;

  const index = (window.SF_LABELS || []).concat(window.SF_LABELS_DETAIL || []);
  points.forEach(p => {
    if (p.x != null && p.y != null) index.push({ n: p.name, x: p.x, y: p.y });
  });

  let hits = [];

  function flyToLabel(h) {
    map.flyTo({ center: toLngLat(h.x, h.y), zoom: z0 + 2.6, duration: 700 });
    list.hidden = true;
  }

  function render(q) {
    const v = q.trim();
    if (!v) { list.hidden = true; list.innerHTML = ''; return; }
    hits = index.filter(l => l.n && l.n.indexOf(v) >= 0).slice(0, 8);
    if (!hits.length) { list.innerHTML = '<li class="q-empty">没找到</li>'; list.hidden = false; return; }
    list.innerHTML = hits.map((h, i) =>
      '<li><button type="button" data-i="' + i + '">' + SF.esc(h.n) + '</button></li>').join('');
    list.hidden = false;
  }

  input.addEventListener('input', () => render(input.value));
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && hits.length) { e.preventDefault(); flyToLabel(hits[0]); }
    if (e.key === 'Escape') list.hidden = true;
  });
  list.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const h = hits[Number(btn.getAttribute('data-i'))];
    if (h) flyToLabel(h);
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.map-search')) list.hidden = true;
  });
}

/* ---------- 导出图片 ---------- */

document.getElementById('export-png').addEventListener('click', function () {
  const btn = this;
  btn.textContent = '导出中…';

  map.once('render', () => {
    const src = map.getCanvas();
    const out = document.createElement('canvas');
    out.width = src.width;
    out.height = src.height;
    const ctx = out.getContext('2d');
    ctx.drawImage(src, 0, 0);

    // 把标签和点位画进图里（DOM 层不会被导出）
    const size = map.getCanvas().getBoundingClientRect();
    const s = zoomToScale(map.getZoom());
    const want = tiersAt(s);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const n of labelNodes) {
      if (want.indexOf(n.t) < 0) continue;
      const p = map.project(n.ll);
      if (p.x < 0 || p.x > size.width || p.y < 0 || p.y > size.height) continue;
      ctx.font = (n.t === 1 ? '600 13px' : '12px') + ' system-ui, "Microsoft YaHei", sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255,255,255,.95)';
      ctx.strokeText(n.el.textContent, p.x, p.y);
      ctx.fillStyle = n.t === 1 ? '#3f3f3b' : '#6b6a64';
      ctx.fillText(n.el.textContent, p.x, p.y);
    }

    for (const n of pointNodes) {
      if (n.el.style.display === 'none') continue;
      const p = map.project(n.ll);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
      ctx.fillStyle = n.p.level === 'recommended' ? '#2f6f4a' : '#8a6412';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
    }

    out.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '感官友好地图-' + new Date().toISOString().slice(0, 10) + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      btn.textContent = '导出图片';
    }, 'image/png');
  });
  map.triggerRepaint();
});

/* ---------- 标点（只在 ?pick=1 时出现） ---------- */

if (/[?&]pick=1/.test(location.search)) {
  const btn = document.getElementById('pick-toggle');
  const panel = document.getElementById('pick-panel');
  const coord = document.getElementById('pick-coord');

  btn.hidden = false;
  let picking = false;

  btn.addEventListener('click', () => {
    picking = !picking;
    btn.textContent = picking ? '标点中' : '标点';
    panel.hidden = !picking;
    map.getCanvas().style.cursor = picking ? 'crosshair' : '';
  });

  map.on('click', e => {
    if (!picking) return;
    const [x, y] = toXY(e.lngLat.lng, e.lngLat.lat);
    coord.textContent = Math.round(x) + ', ' + Math.round(y);
  });

  document.getElementById('pick-copy').addEventListener('click', function () {
    if (navigator.clipboard) navigator.clipboard.writeText(coord.textContent);
    const self = this;
    self.textContent = '已复制';
    setTimeout(() => { self.textContent = '复制坐标'; }, 1400);
  });
}
</script>

</body>
