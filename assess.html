<main id="main" class="wrap wrap-wide">

  <header class="page-head">
    <h1>评估</h1>
    <p class="lead">六项各选一个分数，没测的留空，填完直接出等级。</p>
  </header>

  <form id="form" novalidate>

    <section class="card">
      <h2>点位</h2>
      <div class="grid-2">
        <label class="field">
          <span>编号</span>
          <input name="id" list="place-list" placeholder="HGG-01" autocomplete="off">
        </label>
        <datalist id="place-list"></datalist>
        <label class="field">
          <span>名称</span>
          <input name="name" placeholder="某社区卫生服务中心" autocomplete="off">
        </label>
        <label class="field">
          <span>环境类型</span>
          <select name="envType" id="envType"></select>
        </label>
        <label class="field">
          <span>场景包</span>
          <select name="scenario" id="scenario"></select>
        </label>
        <label class="field">
          <span>观察时间</span>
          <input type="datetime-local" name="observedAt">
        </label>
      </div>
    </section>

    <section class="card">
      <h2>位置</h2>
      <p class="hint">在图上点一下，坐标跟着评估一起导出。不选也行，这个点就不会出现在地图上。</p>
      <div class="actions" style="margin-top:12px">
        <button type="button" class="btn btn-ghost" id="pick-open">在地图上选位置</button>
      </div>
      <div id="pick-wrap" hidden style="margin-top:14px">
        <div id="picker" class="picker"></div>
        <p class="hint" id="pick-val">坐标：未选</p>
        <p class="hint">底图 © <a href="https://www.openstreetmap.org/copyright" rel="noopener">OpenStreetMap contributors</a>，ODbL 1.0。</p>
        <div class="actions" style="margin-top:10px">
          <button type="button" class="btn btn-ghost" id="pick-clear">清除位置</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>六项</h2>
      <p class="hint">每个选项都是判定标准本身。不确定就留空，留空不会当成 0 分。</p>
      <div id="dims"></div>
    </section>

    <section class="card">
      <h2>等级</h2>
      <div class="result" id="result" aria-live="polite">
        <span class="badge badge-none"><span class="glyph" aria-hidden="true">○</span>暂无数据</span>
        <span class="result-text">还没填。</span>
      </div>
      <div id="result-bars"></div>
      <label class="field" style="margin-top:18px">
        <span>一句建议</span>
        <input name="note" placeholder="避开 11:30—12:30，从东门进" autocomplete="off">
      </label>
      <p class="hint" id="tools-note" style="margin-top:12px"></p>
    </section>

    <div class="actions">
      <button type="button" class="btn" id="export">导出 JSON</button>
      <button type="button" class="btn btn-ghost" id="save">保存草稿</button>
      <button type="button" class="btn btn-ghost" id="clear">清空</button>
    </div>

  </form>

</main>

<footer class="site-foot">
  <div class="wrap">
    <div class="foot-inner">
      <span>感官友好评估 · 海港区</span>
