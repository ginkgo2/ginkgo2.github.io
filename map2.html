<script type="module">
import * as maplibregl from './assets/vendor/maplibre/maplibre-gl.mjs';

const BBOX = { s: 39.878, w: 119.515, n: 39.958, e: 119.683 };
const W = 1000, H = 620;

// 把底图的像素坐标反算成经纬度（和 build-map.mjs 用同一套投影）
const lat0 = (BBOX.s + BBOX.n) / 2;
const kx = Math.cos(lat0 * Math.PI / 180);
const dx = (BBOX.e - BBOX.w) * kx;
const dy = BBOX.n - BBOX.s;
const scale = Math.min(W / dx, H / dy);
const offX = (W - dx * scale) / 2;
const offY = (H - dy * scale) / 2;

const toLngLat = (x, y) => [
  BBOX.w + (x - offX) / (kx * scale),
  BBOX.n - (y - offY) / scale
];

const status = document.getElementById('status');

const map = new maplibregl.Map({
  container: 'ml-map',
  style: {
    version: 8,
    sources: {},
    layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#f7f5f1' } }]
  },
  bounds: [[BBOX.w, BBOX.s], [BBOX.e, BBOX.n]],
  fitBoundsOptions: { padding: 8 },
  attributionControl: false,
  dragRotate: false,
  pitchWithRotate: false
});

map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

map.on('load', async () => {
  const [base, detail] = await Promise.all([
    fetch('./data/map-base.geojson').then(r => r.json()),
    fetch('./data/map-detail.geojson').then(r => r.json())
  ]);

  map.addSource('base', { type: 'geojson', data: base });
  map.addSource('detail', { type: 'geojson', data: detail });

  map.addLayer({ id: 'water', type: 'fill', source: 'base', filter: ['==', ['get', 'kind'], 'water'], paint: { 'fill-color': '#d5e7f0' } });
  map.addLayer({ id: 'park', type: 'fill', source: 'base', filter: ['==', ['get', 'kind'], 'park'], paint: { 'fill-color': '#dfeada' } });

  const widths = { motorway: 3.8, trunk: 3.3, primary: 2.6, secondary: 1.9, tertiary: 1.3 };
  const colors = { motorway: '#efc469', trunk: '#f3d39a', primary: '#fbe7c2', secondary: '#ffffff', tertiary: '#ffffff' };
  const casings = { motorway: '#dcb877', trunk: '#ddc49a', primary: '#ddd0b6', secondary: '#ded8cc', tertiary: '#e6e1d7' };

  for (const cls of ['tertiary', 'secondary', 'primary', 'trunk', 'motorway']) {
    map.addLayer({
      id: 'road-c-' + cls, type: 'line', source: 'base',
      filter: ['all', ['==', ['get', 'kind'], 'road'], ['==', ['get', 'cls'], cls]],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: {
        'line-color': casings[cls],
        'line-width': ['interpolate', ['linear'], ['zoom'], 12, widths[cls] + 1.1, 17, (widths[cls] + 1.1) * 1.8]
      }
    });
    map.addLayer({
      id: 'road-f-' + cls, type: 'line', source: 'base',
      filter: ['all', ['==', ['get', 'kind'], 'road'], ['==', ['get', 'cls'], cls]],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: {
        'line-color': colors[cls],
        'line-width': ['interpolate', ['linear'], ['zoom'], 12, widths[cls], 17, widths[cls] * 1.8]
      }
    });
  }

  map.addLayer({
    id: 'building', type: 'fill', source: 'detail', minzoom: 15.0,
    filter: ['==', ['get', 'kind'], 'building'],
    paint: { 'fill-color': '#e2ddcf', 'fill-outline-color': '#d2cbbb' }
  });

  map.addLayer({
    id: 'minor-casing', type: 'line', source: 'detail', minzoom: 14.6,
    filter: ['==', ['get', 'kind'], 'minor'],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: {
      'line-color': '#d8d2c4',
      'line-width': ['interpolate', ['linear'], ['zoom'], 14.6, 1.6, 18, 3.4]
    }
  });

  map.addLayer({
    id: 'minor', type: 'line', source: 'detail', minzoom: 14.6,
    filter: ['==', ['get', 'kind'], 'minor'],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: {
      'line-color': '#ffffff',
      'line-width': ['interpolate', ['linear'], ['zoom'], 14.6, 1.0, 18, 2.4]
    }
  });

  map.addLayer({
    id: 'gate', type: 'circle', source: 'detail', minzoom: 15.5,
    filter: ['==', ['get', 'kind'], 'gate'],
    paint: { 'circle-color': '#a03b2f', 'circle-radius': ['interpolate', ['linear'], ['zoom'], 15, 3, 18, 6], 'circle-stroke-color': '#fff', 'circle-stroke-width': 1 }
  });

  status.textContent = '已加载：底图 ' + base.features.length + ' 个要素，细节 ' + detail.features.length + ' 个要素。';
  startLabels();
});

/* ---------- 标签叠层：跟随地图投影，做简单避让 ---------- */

function startLabels() {
  const host = document.getElementById('ml-map');
  const layer = document.createElement('div');
  layer.className = 'lbl-layer';
  host.appendChild(layer);

  const all = (window.SF_LABELS || []).concat(window.SF_LABELS_DETAIL || []);
  const nodes = all.map(l => {
    const el = document.createElement('span');
    el.className = 'lbl t' + l.t;
    el.textContent = l.n;
    el.style.display = 'none';
    layer.appendChild(el);
    const ll = toLngLat(l.x, l.y);
    return { el, ll, t: l.t, r: l.r || 9 };
  });

  function tiersAt(z) {
    if (z < 14.0) return [1];
    if (z < 14.6) return [2];
    return [2, 3];
  }

  let raf = 0;
  function update() {
    raf = 0;
    const size = map.getCanvas().getBoundingClientRect();
    const want = tiersAt(map.getZoom());
    const placed = [];

    for (const n of nodes) {
      if (want.indexOf(n.t) < 0) { n.el.style.display = 'none'; continue; }

      const p = map.project(n.ll);
      if (p.x < -80 || p.x > size.width + 80 || p.y < -30 || p.y > size.height + 30) {
        n.el.style.display = 'none';
        continue;
      }

      const w = n.el.textContent.length * 12 * 0.95;
      const h = 14;
      const box = { x1: p.x - w / 2, x2: p.x + w / 2, y1: p.y - h / 2, y2: p.y + h / 2 };

      let hit = false;
      for (const b of placed) {
        if (box.x1 < b.x2 && box.x2 > b.x1 && box.y1 < b.y2 && box.y2 > b.y1) { hit = true; break; }
      }
      if (hit) { n.el.style.display = 'none'; continue; }

      placed.push(box);
      n.el.style.display = '';
      n.el.style.left = p.x + 'px';
      n.el.style.top = p.y + 'px';
    }
  }

  function schedule() {
    if (!raf) raf = requestAnimationFrame(update);
  }

  map.on('move', schedule);
  map.on('zoom', schedule);
  map.on('resize', schedule);
  update();
}
</script>
